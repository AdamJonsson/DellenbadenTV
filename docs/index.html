<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dellenbaden</title>
<style>
/* ── Reset ─────────────────────────────────────────────────── */
*, *:before, *:after {
  margin: 0; padding: 0;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  font-family: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

/* ── Stage ─────────────────────────────────────────────────── */
#stage {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  -webkit-transition: opacity 0.8s ease-in-out;
  -moz-transition:    opacity 0.8s ease-in-out;
  -o-transition:      opacity 0.8s ease-in-out;
  transition:         opacity 0.8s ease-in-out;
}

/* ── Background image ──────────────────────────────────────── */
#bg-wrapper {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  -webkit-transform-origin: center center;
  transform-origin: center center;
  /* GPU layer promotion lives here — static, never animated.
     This means #bg can run a plain scale() animation with no
     transform conflicts, which old WebKit handles reliably. */
  -webkit-transform: translateZ(0);
  transform:         translateZ(0);
  -webkit-backface-visibility: hidden;
  backface-visibility:         hidden;
}
#bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #0a0e1a;
}

/* Ken Burns slow zoom — plain scale() with webkit prefix for old TV browsers */
@-webkit-keyframes kb {
  from { -webkit-transform: scale(1);    transform: scale(1); }
  to   { -webkit-transform: scale(1.06); transform: scale(1.06); }
}
@keyframes kb {
  from { -webkit-transform: scale(1);    transform: scale(1); }
  to   { -webkit-transform: scale(1.06); transform: scale(1.06); }
}
#bg.animate {
  -webkit-animation: kb 20s ease-out forwards;
  animation:         kb 20s ease-out forwards;
}

/* Fallback gradients when there is no image */
#bg.type-program {
  background-image: -webkit-linear-gradient(135deg, #0d1b3e 0%, #091026 55%, #150824 100%);
  background-image:         linear-gradient(135deg, #0d1b3e 0%, #091026 55%, #150824 100%);
}
#bg.type-menu {
  background-image: -webkit-linear-gradient(135deg, #2a1508 0%, #180e04 55%, #0e1a0a 100%);
  background-image:         linear-gradient(135deg, #2a1508 0%, #180e04 55%, #0e1a0a 100%);
}

/* ── Gradient overlay ──────────────────────────────────────── */
#overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 70%;
  background: -webkit-linear-gradient(top, transparent 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0.92) 100%);
  background:         linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0.92) 100%);
}

/* ── Content block ─────────────────────────────────────────── */
#content {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 0 7% 7%;
}

.badge {
  display: inline-block;
  font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
  font-size: 40px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 0.35em 1em;
  border-radius: 2px;
  margin-bottom: 1.4em;
  border: 1px solid;
}
.badge.program {
  color: #a8c4f0;
  border-color: rgba(168,196,240,0.45);
  background: rgba(60,100,180,0.18);
}
.badge.menu {
  color: #e8c97a;
  border-color: rgba(232,201,122,0.45);
  background: rgba(180,120,30,0.18);
}
.badge.sponsor {
  color: #a8e6c0;
  border-color: rgba(168,230,192,0.45);
  background: rgba(30,130,70,0.18);
}

#title {
  font-size: 100px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.01em;
  margin-bottom: 0px;
  max-width: 70%;
}

#subtitle {
  font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
  font-size: 100px;
  font-weight: 400;
  color: #e8c97a;
  letter-spacing: 0.02em;
}
#subtitle.program-date { color: #a8c4f0; }
#subtitle.menu-price   { color: #e8c97a; }

#description {
  font-size: 50px;
  line-height: 1.55;
  color: rgba(255,255,255,0.9);
  max-width: 75%;
}

/* ── Wordmark ───────────────────────────────────────────────── */
#wordmark {
  position: absolute;
  top: 5.5%;
  right: 5.5%;
  height: 5vw;
  width: auto;
  opacity: 0.85;
}

/* ── Slide counter ──────────────────────────────────────────── */
#counter {
  position: absolute;
  top: 5.5%;
  left: 5.5%;
  font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
  font-size: 1vw;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.08em;
}

/* ── Progress bar ───────────────────────────────────────────── */
#progress-track {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: rgba(255,255,255,0.08);
}
#progress-fill {
  height: 100%;
  width: 100%;                       /* always full width — scaled via transform */
  background: rgba(255,255,255,0.7);
  -webkit-transform: scaleX(0);
  transform:         scaleX(0);
  -webkit-transform-origin: left center;
  transform-origin:         left center;
  /* transition is set via JS so duration matches config */
}

/* ── Sponsor background ─────────────────────────────────────── */
/* Sits OUTSIDE the GPU compositing layer (#bg-wrapper) so that
   a plain background-color is reliably painted on old WebKit. */
#sponsor-bg {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
}

/* ── Sponsor logo ───────────────────────────────────────────── */
#sponsor-logo-wrapper {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
}
#sponsor-logo {
  position: absolute;
  top: 50%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform:         translate(-50%, -50%);
  max-width: 65%;
  max-height: 55%;
}

/* ── Error / loading state ──────────────────────────────────── */
#loading {
  position: fixed;
  top: 50%; left: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform:         translate(-50%, -50%);
  font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
  font-size: 1.4vw;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div id="loading">Laddar&hellip;</div>

<div id="stage" style="opacity:0">
  <div id="bg-wrapper">
    <div id="bg" class="type-program animate"></div>
  </div>
  <div id="sponsor-bg"></div>
  <div id="overlay"></div>
  <div id="sponsor-logo-wrapper">
    <img id="sponsor-logo" src="" alt="">
  </div>

  <img id="wordmark" src="images/Dellenbaden.png" alt="Dellenbaden">
  <div id="counter"></div>

  <div id="content">
    <span class="badge program" id="badge">Program</span>
    <h1 id="title"></h1>
    <p  id="subtitle" class="program-date"></p>
    <p  id="description"></p>
  </div>

  <div id="progress-track">
    <div id="progress-fill"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── Default config (overridden by config.json) ──── */
  var cfg = {
    slideDuration      : 8000,
    transitionDuration : 800,
    programsToShow     : 12,
    iceCreamInterval   : 3,    /* show a menu slide after every N program slides */
    futureDaysLimit    : 21,
    refreshInterval    : 7200  /* auto-reload page after this many seconds; 0 = off */
  };

  /* ── DOM refs ────────────────────────────────────── */
  var stage               = document.getElementById('stage');
  var bgWrapper           = document.getElementById('bg-wrapper');
  var bg                  = document.getElementById('bg');
  var sponsorBg           = document.getElementById('sponsor-bg');
  var overlay             = document.getElementById('overlay');
  var sponsorLogoWrapper  = document.getElementById('sponsor-logo-wrapper');
  var sponsorLogo         = document.getElementById('sponsor-logo');
  var wordmark            = document.getElementById('wordmark');
  var content             = document.getElementById('content');
  var badge               = document.getElementById('badge');
  var titleEl             = document.getElementById('title');
  var subtitle            = document.getElementById('subtitle');
  var desc                = document.getElementById('description');
  var counter             = document.getElementById('counter');
  var fill                = document.getElementById('progress-fill');
  var loading             = document.getElementById('loading');

  /* ── Feature detection ───────────────────────────── */
  var hasCssTransition = (function () {
    var el = document.createElement('div');
    return 'transition'       in el.style ||
           'webkitTransition' in el.style ||
           'OTransition'      in el.style ||   /* Opera Presto (TV browsers) */
           'MozTransition'    in el.style;
  }());

  var hasCssAnimation = (function () {
    var el = document.createElement('div');
    return 'animation'       in el.style ||
           'webkitAnimation' in el.style ||
           'OAnimation'      in el.style ||    /* Opera Presto (TV browsers) */
           'MozAnimation'    in el.style;
  }());

  /* ── State ───────────────────────────────────────── */
  var playlist = [];
  var idx      = 0;
  var timer    = null;

  /* ── XHR helper ──────────────────────────────────── */
  function loadJson(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        try { cb(null, JSON.parse(xhr.responseText)); }
        catch (e) { cb(e, null); }
      } else {
        cb(new Error('HTTP ' + xhr.status), null);
      }
    };
    xhr.send();
  }

  /* ── Date formatter ──────────────────────────────── */
  var DAYS   = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  var MONTHS = ['januari','februari','mars','april','maj','juni',
                'juli','augusti','september','oktober','november','december'];

  function formatDate(isoDate, time) {
    try {
      var d = new Date(isoDate);
      var s = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
      if (time) s += '  ·  ' + time;
      return s;
    } catch (e) { return ''; }
  }

  /* ── Playlist builder ────────────────────────────── */
  function buildPlaylist(programs, menuItems, sponsors) {
    /* Filter to programs within the next futureDaysLimit days */
    var now     = new Date();
    var todayMs = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    var limitMs = todayMs + cfg.futureDaysLimit * 24 * 60 * 60 * 1000;
    programs = programs.filter(function (p) {
      if (!p.date) return true;
      var t = new Date(p.date).getTime();
      return t >= todayMs && t <= limitMs;
    });

    var count = Math.min(programs.length, cfg.programsToShow);
    if (count === 0 && menuItems.length === 0 && sponsors.length === 0) return [];

    /* How many menu slides will be interspersed among the programs? */
    var numMenus = (count > 0 && menuItems.length > 0 && cfg.iceCreamInterval > 0)
                   ? Math.floor(count / cfg.iceCreamInterval) : 0;

    /* Number of content slots must be large enough to show every program+menu
       AND to show every sponsor at least once per rotation.
       Sponsors appear after EVERY content slot (program or menu). */
    var contentSlots = Math.max(
      count + numMenus,
      sponsors.length,
      count > 0 ? 1 : menuItems.length
    );

    var list = [], progIdx = 0, menuIdx = 0, sponsorIdx = 0, progSeen = 0;

    for (var i = 0; i < contentSlots; i++) {
      /* Insert a menu slide instead of a program every iceCreamInterval programs */
      var useMenu = menuItems.length > 0 && cfg.iceCreamInterval > 0 &&
                    progSeen > 0 && progSeen % cfg.iceCreamInterval === 0;

      if (useMenu) {
        list.push({ type: 'menu', data: menuItems[menuIdx % menuItems.length] });
        menuIdx++;
        progSeen = 0;
      } else if (count > 0) {
        list.push({ type: 'program', data: programs[progIdx % count] });
        progIdx++;
        progSeen++;
      } else {
        /* No programs at all — cycle through menu items */
        list.push({ type: 'menu', data: menuItems[menuIdx % menuItems.length] });
        menuIdx++;
      }

      /* A sponsor always follows every content slide */
      if (sponsors.length > 0) {
        list.push({ type: 'sponsor', data: sponsors[sponsorIdx % sponsors.length] });
        sponsorIdx++;
      }
    }

    return list;
  }

  /* ── Ken Burns reset ─────────────────────────────── */
  function restartKenBurns() {
    if (!hasCssAnimation) return;
    bg.className = bg.className.replace(/\s*animate\s*/g, ' ').trim();
    void bg.offsetWidth; // force reflow so removing the class takes effect
    bg.className += ' animate';
  }

  /* ── Progress bar ────────────────────────────────── */
  function resetProgress() {
    /* Reset to scaleX(0) instantly, then animate to scaleX(1).
       Using transform instead of width avoids layout recalculation on every frame. */
    fill.style.webkitTransition = 'none';
    fill.style.transition       = 'none';
    fill.style.webkitTransform  = 'scaleX(0)';
    fill.style.transform        = 'scaleX(0)';
    /* Force reflow so the reset takes effect before the transition is re-enabled */
    void fill.offsetWidth;
    var durSec = (cfg.slideDuration + cfg.transitionDuration) / 1000;
    fill.style.webkitTransition = '-webkit-transform ' + durSec + 's linear';
    fill.style.transition       = 'transform ' + durSec + 's linear';
    fill.style.webkitTransform  = 'scaleX(1)';
    fill.style.transform        = 'scaleX(1)';
  }

  /* ── Apply slide content ─────────────────────────── */
  function applySlide(item) {
    var isSponsor = item.type === 'sponsor';
    var isProgram = item.type === 'program';
    var data      = item.data;

    /* ── Background ── */
    if (isSponsor) {
      /* Hide the ENTIRE bg-wrapper (and its GPU compositing layer).
         Old Opera/WebKit TV browsers can paint the GPU compositing layer
         as black when its contents are transparent, obscuring anything
         behind it.  display:none removes the layer from rendering entirely,
         leaving #sponsor-bg — a plain div with no transforms — to carry
         the solid background colour reliably on any engine. */
      bgWrapper.style.display         = 'none';
      sponsorBg.style.backgroundColor = data.background || '#ffffff';
      sponsorBg.style.display         = 'block';
    } else {
      /* Restore the photo/gradient layer */
      bgWrapper.style.display  = '';
      sponsorBg.style.display  = 'none';
      bg.style.backgroundImage = '';
      var typeClass = isProgram ? 'type-program' : 'type-menu';
      bg.className  = typeClass;
      bg.style.backgroundImage = data.imageUrl ? 'url("' + data.imageUrl + '")' : '';
    }

    /* ── Image rotation (program/menu only) ── */
    var rotation = 0;
    if (!isSponsor && data.imageUrl && cfg.imageRotations) {
      var filename = decodeURIComponent(data.imageUrl.split('/').pop());
      rotation = cfg.imageRotations[filename] || 0;
    }
    if (rotation) {
      var rscale = (rotation % 180 !== 0)
        ? Math.max(window.innerWidth / window.innerHeight, window.innerHeight / window.innerWidth)
        : 1;
      var xform = 'rotate(' + rotation + 'deg) scale(' + rscale + ')';
      bgWrapper.style.webkitTransform = xform;
      bgWrapper.style.transform       = xform;
    } else {
      bgWrapper.style.webkitTransform = '';
      bgWrapper.style.transform       = '';
    }

    /* ── Gradient overlay: hidden for sponsor slides ── */
    overlay.style.display = isSponsor ? 'none' : '';

    /* ── Wordmark + counter: hidden for sponsor slides ── */
    wordmark.style.display = isSponsor ? 'none' : '';
    counter.style.display  = isSponsor ? 'none' : '';

    /* ── Sponsor logo ── */
    if (isSponsor) {
      sponsorLogo.src                  = data.imageUrl || '';
      sponsorLogo.alt                  = data.name    || '';
      sponsorLogoWrapper.style.display = 'block';
    } else {
      sponsorLogoWrapper.style.display = 'none';
      sponsorLogo.src                  = '';
    }

    /* ── Content block: hidden for sponsor slides ── */
    content.style.display = isSponsor ? 'none' : '';

    /* ── Badge / title / subtitle / description (non-sponsor only) ── */
    if (!isSponsor) {
      badge.className   = 'badge ' + (isProgram ? 'program' : 'menu');
      badge.textContent = isProgram ? 'Program' : 'Glassbar';

      titleEl.textContent = isProgram
        ? (data.title || data.dateText || '')
        : (data.name  || '');

      if (isProgram) {
        subtitle.textContent = formatDate(data.date, data.time);
        subtitle.className   = 'program-date';
      } else {
        subtitle.textContent = data.price || '';
        subtitle.className   = 'menu-price';
      }

      desc.textContent = data.description || '';
    }

    /* ── Counter ── */
    counter.textContent = (idx + 1) + ' / ' + playlist.length;

    /* ── Ken Burns: program/menu only ── */
    if (!isSponsor) {
      restartKenBurns();
    } else {
      bg.className = bg.className.replace(/\s*animate\s*/g, ' ').trim();
    }
  }

  /* ── Show a slide ────────────────────────────────── */
  function showSlide(i) {
    if (playlist.length === 0) return;

    var item = playlist[i];

    if (hasCssTransition) {
      stage.style.opacity = '0';
      timer = setTimeout(function () {
        applySlide(item);
        stage.style.opacity = '1';
        resetProgress();
        timer = setTimeout(advance, cfg.slideDuration);
      }, cfg.transitionDuration);
    } else {
      applySlide(item);
      resetProgress();
      timer = setTimeout(advance, cfg.slideDuration);
    }
  }

  function advance() {
    idx = (idx + 1) % playlist.length;
    showSlide(idx);
  }

  /* ── Bootstrap ───────────────────────────────────── */
  function start(programs, menuItems, sponsors) {
    loading.style.display = 'none';
    playlist = buildPlaylist(programs, menuItems, sponsors);

    if (playlist.length === 0) {
      loading.style.display = 'block';
      loading.textContent   = 'Inga program hittades. Kör npm run fetch.';
      return;
    }

    idx = 0;
    applySlide(playlist[0]);
    stage.style.opacity = '1';
    resetProgress();
    timer = setTimeout(advance, cfg.slideDuration);
  }

  function init(programs, menuItems, sponsors) {
    /* Auto-refresh so the program list stays current without manual intervention */
    if (cfg.refreshInterval > 0) {
      setTimeout(function () { location.reload(); }, cfg.refreshInterval * 1000);
    }
    start(programs, menuItems, sponsors);
  }

  /* ── Load data files ─────────────────────────────── */
  loadJson('config.json', function (err, data) {
    if (!err && data) {
      for (var k in data) {
        if (data.hasOwnProperty(k)) cfg[k] = data[k];
      }
    }

    var programs  = [];
    var menuItems = [];
    var sponsors  = [];
    var pending   = 3;

    function onDone() {
      pending--;
      if (pending === 0) init(programs, menuItems, sponsors);
    }

    loadJson('data/programs.json', function (err, data) {
      if (!err && Array.isArray(data)) programs = data;
      onDone();
    });

    loadJson('data/menu.json', function (err, data) {
      if (!err && Array.isArray(data)) menuItems = data;
      onDone();
    });

    loadJson('data/sponsors.json', function (err, data) {
      if (!err && Array.isArray(data)) sponsors = data;
      onDone(); /* missing file → empty array, sponsors simply won't appear */
    });
  });

}());
</script>
</body>
</html>
